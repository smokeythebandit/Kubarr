name: Test

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-backend-test

      - name: Load image
        run: docker load < kubarr-backend-test.tar

      - name: Unit tests
        run: docker run --rm "kubarr-backend-test:${{ inputs.image-tag }}" cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-frontend-test

      - name: Load image
        run: docker load < kubarr-frontend-test.tar

      - name: Unit tests
        run: docker run --rm "kubarr-frontend-test:${{ inputs.image-tag }}" pnpm test

      - name: Build
        run: docker run --rm "kubarr-frontend-test:${{ inputs.image-tag }}" pnpm run build

  coverage:
    name: backend / coverage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: code/api
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20
        with:
          tool: cargo-tarpaulin
      - run: cargo tarpaulin --no-fail-fast --out Xml --output-dir coverage
        working-directory: code/api
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-report
          path: code/api/coverage/cobertura.xml
          retention-days: 30

  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KIND_CLUSTER: kubarr-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      TAG: ${{ inputs.image-tag }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install tools (kind, kubectl, helm)
        run: |
          mkdir -p "$HOME/.local/bin"
          # kind
          curl -fsSLo "$HOME/.local/bin/kind" https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x "$HOME/.local/bin/kind"
          # kubectl — use Google storage (dl.k8s.io mirror) for reliability
          curl -fsSLo "$HOME/.local/bin/kubectl" \
            "https://storage.googleapis.com/kubernetes-release/release/v1.29.2/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          # helm — extract from Docker image to avoid Fastly CDN SSL issues
          docker create --name helm-extract alpine/helm:3.21.0
          docker cp helm-extract:/usr/bin/helm "$HOME/.local/bin/helm"
          docker rm helm-extract
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kind" version
          "$HOME/.local/bin/kubectl" version --client
          "$HOME/.local/bin/helm" version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.3

      - name: Install dependencies
        working-directory: code/frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright
        working-directory: code/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Download backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-backend

      - name: Download frontend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-frontend

      - name: Load images
        run: |
          docker load < kubarr-backend.tar
          docker load < kubarr-frontend.tar

      - name: Cleanup stale Kind resources
        run: |
          for cluster in $(kind get clusters 2>/dev/null); do
            if [[ "$cluster" == kubarr-e2e-* && "$cluster" != "$KIND_CLUSTER" ]]; then
              echo "Removing stale cluster: $cluster"
              kind delete cluster --name "$cluster" 2>/dev/null || true
            fi
          done
          docker rm -f kind-registry 2>/dev/null || true
          docker container prune -f 2>/dev/null || true
          pkill -f "kubectl port-forward" 2>/dev/null || true

      - name: Start local registry
        run: |
          docker run -d -p 5001:5000 --name kind-registry --restart=always registry:2
          # Wait for registry to be ready
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:5001/v2/ 2>/dev/null; then
              echo "Registry is ready"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Registry did not become ready"
          exit 1

      - name: Cache third-party images in local registry
        run: |
          # Pre-pull bootstrap component images and push to the local registry so
          # Kind nodes (inside DinD) don't have to fetch them from DockerHub at
          # deploy time. This avoids rate-limit-induced startup delays that cause
          # the bootstrap timeout to expire (victoriametrics image is ~100MB and
          # takes 4-5 min to pull cold from a rate-limited IP).
          #
          # Images are pushed with paths matching the DockerHub mirror namespace:
          #   - Official library images: localhost:5001/library/<image>:<tag>
          #   - Other images:            localhost:5001/<org>/<image>:<tag>
          pull_and_cache() {
            local image="$1"
            local dest="$2"
            echo "Pulling ${image}..."
            docker pull --platform linux/amd64 "${image}"
            echo "Pushing to local registry as ${dest}..."
            docker tag "${image}" "localhost:5001/${dest}"
            docker push "localhost:5001/${dest}"
          }
          pull_and_cache postgres:16-alpine                                   library/postgres:16-alpine
          pull_and_cache victoriametrics/victoria-metrics:v1.96.0             victoriametrics/victoria-metrics:v1.96.0
          pull_and_cache victoriametrics/victoria-logs:v1.3.2-victorialogs    victoriametrics/victoria-logs:v1.3.2-victorialogs
          pull_and_cache fluent/fluent-bit:3.2.2                              fluent/fluent-bit:3.2.2

      - name: Create Kind cluster
        run: |
          # Use native snapshotter — overlayfs is not available inside DinD.
          # Mirror localhost:5001 to the local registry for kubarr images.
          # Mirror docker.io to the local registry (with DockerHub fallback) so
          # bootstrap component pods (postgres, victoriametrics, etc.) are served
          # instantly from the local cache instead of pulling from DockerHub.
          cat > /tmp/kind-config.yaml << 'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".containerd]
                snapshotter = "native"
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
                endpoint = ["http://kind-registry:5000"]
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
                endpoint = ["http://kind-registry:5000", "https://registry-1.docker.io"]
          EOF
          for attempt in 1 2 3; do
            echo "=== Kind cluster creation attempt ${attempt}/3 ==="
            if kind create cluster --name "$KIND_CLUSTER" --image kindest/node:v1.29.2 \
                --config /tmp/kind-config.yaml --wait 180s 2>&1; then
              echo "Cluster created successfully on attempt ${attempt}"
              # Connect registry to Kind network so nodes can resolve kind-registry hostname
              docker network connect "kind" kind-registry 2>/dev/null || true
              kubectl cluster-info --context "kind-${KIND_CLUSTER}"
              exit 0
            fi
            echo "Attempt ${attempt} failed"
            kind delete cluster --name "$KIND_CLUSTER" 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 10s before retry..."
              sleep 10
            fi
          done
          echo "ERROR: Failed to create Kind cluster after 3 attempts"
          exit 1

      - name: Push kubarr images to local registry
        run: |
          docker tag "kubarr-backend:${TAG}" "localhost:5001/kubarr-backend:${TAG}"
          docker push "localhost:5001/kubarr-backend:${TAG}"
          docker tag "kubarr-frontend:${TAG}" "localhost:5001/kubarr-frontend:${TAG}"
          docker push "localhost:5001/kubarr-frontend:${TAG}"

      - name: Clone charts
        run: git clone --depth 1 https://github.com/smokeythebandit/kubarr-charts.git charts

      - name: Deploy Kubarr
        run: |
          openssl genrsa -out "/tmp/jwt-private-${KIND_CLUSTER}.pem" 2048
          openssl rsa -in "/tmp/jwt-private-${KIND_CLUSTER}.pem" -pubout -out "/tmp/jwt-public-${KIND_CLUSTER}.pem"

          kubectl create namespace kubarr --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic kubarr-jwt-keys \
            --from-file=private.pem="/tmp/jwt-private-${KIND_CLUSTER}.pem" \
            --from-file=public.pem="/tmp/jwt-public-${KIND_CLUSTER}.pem" \
            -n kubarr --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install kubarr ./charts/kubarr \
            --namespace kubarr \
            --set namespace.create=false \
            --set backend.image.repository=localhost:5001/kubarr-backend \
            --set "backend.image.tag=${TAG}" \
            --set backend.image.pullPolicy=IfNotPresent \
            --set frontend.image.repository=localhost:5001/kubarr-frontend \
            --set "frontend.image.tag=${TAG}" \
            --set frontend.image.pullPolicy=IfNotPresent \
            --set oauth2.enabled=true \
            --set auth.jwt.existingSecret=kubarr-jwt-keys \
            --set networkPolicy.enabled=false \
            --set backend.livenessProbe.initialDelaySeconds=30 \
            --set backend.livenessProbe.timeoutSeconds=5 \
            --set backend.livenessProbe.failureThreshold=6 \
            --set backend.readinessProbe.initialDelaySeconds=5 \
            --set backend.readinessProbe.periodSeconds=5 \
            --set backend.readinessProbe.failureThreshold=30 \
            --timeout=5m

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=kubarr-backend -n kubarr --timeout=300s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=kubarr-frontend -n kubarr --timeout=120s
          kubectl get pods -n kubarr

      - name: Port-forward
        run: |
          # Watchdog loop: restart port-forward automatically if it dies mid-test
          (while true; do
            kubectl port-forward --address 127.0.0.1 svc/kubarr-backend 18000:8000 -n kubarr
            echo "[watchdog] Port-forward exited, restarting in 2s..."
            sleep 2
          done) &

          for _ in $(seq 1 60); do
            if curl -s http://localhost:18000/api/system/health 2>/dev/null | grep -q "ok"; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Backend did not become healthy"
          exit 1

      - name: Playwright
        working-directory: code/frontend
        run: pnpm exec playwright test
        env:
          BASE_URL: http://localhost:18000
          CI: true

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playwright-report
          path: code/frontend/playwright-report/
          retention-days: 14

      - name: Debug logs
        if: failure()
        run: |
          echo "=== Kind version ==="
          kind version 2>/dev/null || true
          echo "=== Docker info ==="
          docker info --format '{{.MemTotal}} memory, {{.NCPU}} CPUs, {{.ContainersRunning}} running' 2>/dev/null || true
          echo "=== Kind clusters ==="
          kind get clusters 2>/dev/null || true
          echo "=== Pod status ==="
          kubectl get pods -A -o wide 2>/dev/null || true
          echo "=== Backend logs ==="
          kubectl logs -l app.kubernetes.io/name=kubarr-backend -n kubarr --tail=100 2>/dev/null || true
          echo "=== Frontend logs ==="
          kubectl logs -l app.kubernetes.io/name=kubarr-frontend -n kubarr --tail=50 2>/dev/null || true
          echo "=== Pod events ==="
          kubectl get events -n kubarr --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f "kubectl port-forward.*svc/kubarr-backend.*18000" 2>/dev/null || true
          rm -f "/tmp/jwt-private-${KIND_CLUSTER}.pem" "/tmp/jwt-public-${KIND_CLUSTER}.pem"
          kind delete cluster --name "$KIND_CLUSTER" 2>/dev/null || true
          docker rm -f kind-registry 2>/dev/null || true
