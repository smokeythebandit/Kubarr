name: Release Tests

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  coverage:
    name: backend / coverage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: code/api
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912
        with:
          tool: cargo-tarpaulin
      - run: cargo tarpaulin --lib --no-fail-fast --out Xml --output-dir coverage
        working-directory: code/api
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-report
          path: code/api/coverage/cobertura.xml
          retention-days: 30

  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KIND_CLUSTER: kubarr-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: /tmp/kubarr-e2e-${{ github.run_id }}-${{ github.run_attempt }}.kubeconfig
      CHARTS_REV: ae335477cd0a12f649e8b171d5464dcb2a3b7a5f
      TAG: ${{ inputs.image-tag }}
      TEST_USERNAME: admin
      TEST_PASSWORD: adminadmin

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Checkout pinned charts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: smokeythebandit/kubarr-charts
          ref: ${{ env.CHARTS_REV }}
          path: charts
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: code/cli
      - name: Build installer
        run: cargo build --locked --manifest-path code/cli/Cargo.toml

      - name: Install tools (kind, kubectl, helm)
        run: |
          mkdir -p "$HOME/.local/bin"
          # kind
          curl -fsSLo "$HOME/.local/bin/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x "$HOME/.local/bin/kind"
          # Keep kubectl and the Kind node within Helm's supported Kubernetes range.
          curl -fsSLo "$HOME/.local/bin/kubectl" \
            "https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          # helm — extract from Docker image to avoid Fastly CDN SSL issues
          docker create --name helm-extract alpine/helm:4.3.0
          docker cp helm-extract:/usr/bin/helm "$HOME/.local/bin/helm"
          docker rm helm-extract
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kind" version
          "$HOME/.local/bin/kubectl" version --client
          "$HOME/.local/bin/helm" version

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.34.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: code/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: code/frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('code/frontend/pnpm-lock.yaml') }}

      - name: Install Playwright
        working-directory: code/frontend
        run: |
          pnpm exec playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            pnpm exec playwright install chromium
          fi

      - name: Download backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-backend

      - name: Download frontend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-frontend

      - name: Download worker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-worker

      - name: Load images
        run: |
          gunzip -c kubarr-backend.tar.gz | docker load
          gunzip -c kubarr-frontend.tar.gz | docker load
          gunzip -c kubarr-worker.tar.gz | docker load

      - name: Create Kind cluster
        run: |
          # Managed NFS runs inside Kind but uses the hosted runner's kernel.
          sudo modprobe nfs
          sudo modprobe nfsd
          for attempt in 1 2 3; do
            echo "=== Kind cluster creation attempt ${attempt}/3 ==="
            if kind create cluster --name "$KIND_CLUSTER" \
                --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 \
                --wait 180s 2>&1; then
              echo "Cluster created successfully on attempt ${attempt}"
              kubectl cluster-info --context "kind-${KIND_CLUSTER}"
              exit 0
            fi
            echo "Attempt ${attempt} failed"
            kind delete cluster --name "$KIND_CLUSTER" 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 10s before retry..."
              sleep 10
            fi
          done
          echo "ERROR: Failed to create Kind cluster after 3 attempts"
          exit 1

      - name: Load images into Kind
        run: |
          kind load docker-image --name "$KIND_CLUSTER" \
            "kubarr-backend:${TAG}" "kubarr-frontend:${TAG}" "kubarr-worker:${TAG}"
          # Match the pinned charts; pre-load dependencies before Helm's wait timeout starts.
          for image in \
            itsthenetwork/nfs-server-alpine:12 \
            postgres:16-alpine \
            fluent/fluent-bit:5.1.0 \
            victoriametrics/victoria-metrics:v1.149.0 \
            victoriametrics/victoria-logs:v1.52.0 \
            openresty/openresty:1.27.1.2-alpine; do
            docker pull --platform linux/amd64 "$image"
            kind load docker-image --name "$KIND_CLUSTER" "$image"
          done

      - name: Prepare installer charts
        run: |
          # Build local kubarr-common dependencies in place, preserving file:// paths.
          # The CLI expects a flat chart directory, unlike the categorized source tree.
          mkdir -p "$RUNNER_TEMP/installer-charts"
          for chart in system/managed-nfs system/postgresql \
            monitoring/fluent-bit monitoring/victorialogs monitoring/victoriametrics \
            system/kubarr-backend system/kubarr-frontend system/openresty system/kubarr-worker; do
            helm dependency build --skip-refresh "charts/$chart"
            ln -s "$GITHUB_WORKSPACE/charts/$chart" "$RUNNER_TEMP/installer-charts/${chart##*/}"
          done

      - name: Deploy Kubarr
        env:
          KUBARR_CHARTS_DIR: ${{ runner.temp }}/installer-charts
          KUBARR_BACKEND_IMAGE: kubarr-backend
          KUBARR_FRONTEND_IMAGE: kubarr-frontend
          KUBARR_WORKER_IMAGE: kubarr-worker
          KUBARR_IMAGE_TAG: ${{ inputs.image-tag }}
          KUBARR_IMAGE_PULL_POLICY: Never
        run: |
          # Bootstrap installs dependencies and seeds storage/admin records after migrations.
          # auth.setup.ts logs in to an existing account; it does not create one.
          code/cli/target/debug/kubarr bootstrap \
            --cluster-mode existing \
            --storage-mode managed-nfs --storage-size 5Gi --storage-class standard \
            --admin-username "$TEST_USERNAME" --admin-email admin@example.com \
            --admin-password "$TEST_PASSWORD"
          # Restart with the same catalog revision before tests can install apps.
          for component in kubarr-backend kubarr-worker; do
            kubectl set env "deployment/$component" -n "$component" "KUBARR_CHARTS_GIT_REF=$CHARTS_REV"
          done

      - name: Wait for pods
        run: |
          for component in kubarr-backend kubarr-frontend kubarr-worker; do
            kubectl rollout status "deployment/$component" -n "$component" --timeout=300s
          done
          kubectl rollout status deployment/kubarr-gateway -n openresty --timeout=300s
          kubectl get pods -A

      - name: Port-forward
        run: |
          # Watchdog loop: restart port-forward automatically if it dies mid-test
          (
            trap 'kill "${forward_pid:-}" 2>/dev/null || true; exit 0' TERM
            while true; do
              kubectl port-forward --address 127.0.0.1 svc/kubarr-gateway 18000:8080 -n openresty &
              forward_pid=$!
              wait "$forward_pid" || true
              echo "[watchdog] Port-forward exited, restarting in 2s..."
              sleep 2
            done
          ) &
          echo "$!" > "$RUNNER_TEMP/kubarr-port-forward.pid"

          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:18000/api/system/health | grep -q '"ok"' &&
                curl -fsS --max-time 5 http://localhost:18000/login | grep -q '<html'; then
              echo "Gateway serves both the API and frontend"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Gateway did not become ready"
          exit 1

      - name: Wait for app catalog
        run: |
          # Health does not wait for the asynchronous catalog sync used by 06-apps.spec.ts.
          cookie_jar="$RUNNER_TEMP/kubarr-e2e-cookies"
          trap 'rm -f "$cookie_jar"' EXIT
          jq -n --arg username "$TEST_USERNAME" --arg password "$TEST_PASSWORD" \
            '{username: $username, password: $password}' |
            curl -fsS --max-time 30 -c "$cookie_jar" -H 'Content-Type: application/json' \
              --data-binary @- http://localhost:18000/auth/login > /dev/null
          for _ in $(seq 1 120); do
            if curl -fsS --max-time 10 -b "$cookie_jar" http://localhost:18000/api/apps/catalog |
                jq -e 'map(.name) | ["sonarr", "radarr", "jellyfin"] - . | length == 0' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Required apps did not appear in the catalog"
          exit 1

      - name: Playwright
        working-directory: code/frontend
        run: pnpm exec playwright test
        env:
          BASE_URL: http://localhost:18000
          CI: true

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playwright-report
          path: code/frontend/playwright-report/
          retention-days: 14

      - name: Debug logs
        if: failure()
        run: |
          echo "=== Kind version ==="
          kind version 2>/dev/null || true
          echo "=== Docker info ==="
          docker info --format '{{.MemTotal}} memory, {{.NCPU}} CPUs, {{.ContainersRunning}} running' 2>/dev/null || true
          echo "=== Kind clusters ==="
          kind get clusters 2>/dev/null || true
          echo "=== Pod status ==="
          kubectl get pods -A -o wide 2>/dev/null || true
          for namespace in kubarr-backend kubarr-frontend kubarr-worker openresty \
            kubarr-storage kubarr-database fluent-bit victorialogs victoriametrics; do
            echo "=== $namespace logs ==="
            kubectl logs -n "$namespace" -l app.kubernetes.io/instance --all-containers --tail=100 2>/dev/null || true
          done
          echo "=== Pod events ==="
          kubectl get events -A --sort-by='.lastTimestamp' 2>/dev/null | tail -60 || true

      - name: Cleanup
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/kubarr-port-forward.pid" ]; then
            read -r watchdog_pid < "$RUNNER_TEMP/kubarr-port-forward.pid"
            kill "$watchdog_pid" 2>/dev/null || true
          fi
          kind delete cluster --name "$KIND_CLUSTER" 2>/dev/null || true
