name: Fast Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  acceptance-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Checkout pinned charts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: smokeythebandit/kubarr-charts
          ref: 01e45468f233b03b4a7d70a320aec9075f77c213
          path: acceptance-charts
          persist-credentials: false

      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: 4.3.0

      - name: Set up acceptance helper Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/acceptance-helpers"
          "$RUNNER_TEMP/acceptance-helpers/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/acceptance-helpers/bin" >> "$GITHUB_PATH"

      - name: Offline acceptance safety and polling contracts
        env:
          KUBARR_ACCEPTANCE_CHARTS_DIR: ${{ github.workspace }}/acceptance-charts
        run: |
          bash tests/acceptance/test-helpers.sh
          bash tests/acceptance/test-sonarr-api.sh
          bash tests/acceptance/vpn/test-lab-helpers.sh
          python3 -B -m unittest discover -s tests/acceptance/vpn -p 'test_*.py' -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBECONFIG: /dev/null
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: code/api

      - name: Library and worker/deployment contracts
        run: bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-rust-lib.log" cargo test --locked --lib
        working-directory: code/api

      - name: Operation API and permission contracts
        run: bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-app-operations.log" cargo test --locked --test app_operations_tests
        working-directory: code/api

      - name: Audit security and contract tests
        run: |
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-auth-audit.log" cargo test --locked --test auth_audit_tests
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-admin-audit.log" cargo test --locked --test admin_audit_tests
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-audit-contract.log" cargo test --locked --test audit_contract_tests
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-app-audit.log" cargo test --locked --test app_audit_tests
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-vpn-audit.log" cargo test --locked --test vpn_audit_tests
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-audit-endpoint.log" cargo test --locked --test audit_endpoint_tests
        working-directory: code/api

      - name: Session-authenticated enqueue integration
        run: bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-app-enqueue.log" cargo test --locked --test apps_endpoint_tests queues_without_k8s
        working-directory: code/api

      - name: VPN assignment security and transaction contracts
        run: |
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-vpn-endpoint.log" cargo test --locked --test vpn_endpoint_tests
          bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-vpn-service.log" cargo test --locked --test vpn_service_tests
        working-directory: code/api

      - name: Settings authorization contracts (isolated SQLite)
        run: bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-settings.log" cargo test --locked --test settings_endpoint_tests
        working-directory: code/api

      - name: Registration, approval and invite contracts (isolated SQLite)
        run: bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-registration.log" cargo test --locked --test registration_settings_tests
        working-directory: code/api

      - name: Backend ledger
        if: always()
        run: >-
          python3 tests/report/generate.py
          --rust "$RUNNER_TEMP/kubarr-rust-lib.log"
          --rust "$RUNNER_TEMP/kubarr-settings.log"
          --rust "$RUNNER_TEMP/kubarr-registration.log"
          --rust "$RUNNER_TEMP/kubarr-admin-audit.log"
          --rust "$RUNNER_TEMP/kubarr-app-operations.log"
          --rust "$RUNNER_TEMP/kubarr-auth-audit.log"
          --rust "$RUNNER_TEMP/kubarr-audit-contract.log"
          --rust "$RUNNER_TEMP/kubarr-app-audit.log"
          --rust "$RUNNER_TEMP/kubarr-vpn-audit.log"
          --rust "$RUNNER_TEMP/kubarr-audit-endpoint.log"
          --rust "$RUNNER_TEMP/kubarr-app-enqueue.log"
          --rust "$RUNNER_TEMP/kubarr-vpn-endpoint.log"
          --rust "$RUNNER_TEMP/kubarr-vpn-service.log"
          --output code/frontend/test-results/ledger

      - name: Upload backend ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-test-ledger
          path: code/frontend/test-results/ledger/
          retention-days: 7

  postgres-audit-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubarr_test
          POSTGRES_PASSWORD: testonly_audit_pg
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubarr_test -d audit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: code/api
      - name: PostgreSQL audit migration and write regression
        env:
          AUDIT_TEST_POSTGRES_URL: postgres://kubarr_test:testonly_audit_pg@localhost:5432/audit_test
        run: bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-postgres-audit.log" cargo test --locked --test audit_postgres_migration_tests
        working-directory: code/api

      - name: PostgreSQL audit ledger
        if: always()
        run: python3 tests/report/generate.py --rust "$RUNNER_TEMP/kubarr-postgres-audit.log" --output code/frontend/test-results/ledger

      - name: Upload PostgreSQL audit ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-audit-ledger
          path: code/frontend/test-results/ledger/
          retention-days: 7

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: code/cli
      - run: bash ../../tests/report/run-rust.sh "$RUNNER_TEMP/kubarr-cli.log" cargo test --locked --bin kubarr
        working-directory: code/cli

      - name: CLI ledger
        if: always()
        run: python3 tests/report/generate.py --rust "$RUNNER_TEMP/kubarr-cli.log" --output code/frontend/test-results/ledger

      - name: Upload CLI ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-test-ledger
          path: code/frontend/test-results/ledger/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.34.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: code/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: code/frontend

      - name: Unit tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=test-results/unit.json
        working-directory: code/frontend

      - name: Report generator contracts
        run: python3 -B -m unittest discover -s tests/report -p 'test_*.py'

      - name: Typecheck browser tests
        run: pnpm test:typecheck
        working-directory: code/frontend

      - name: Build
        run: pnpm run build
        working-directory: code/frontend

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: code/frontend

      - name: Deterministic browser tests
        run: pnpm test:browser
        working-directory: code/frontend

      - name: Build test ledger
        if: always()
        run: >-
          python3 tests/report/generate.py
          --vitest code/frontend/test-results/unit.json
          --playwright browser=code/frontend/test-results/browser-results.json
          --output code/frontend/test-results/ledger

      - name: Upload test ledger and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-test-ledger
          path: |
            code/frontend/test-results/ledger/
            code/frontend/test-results/browser/
            code/frontend/playwright-report/browser/
          retention-days: 7

      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-test-results
          path: code/frontend/test-results/browser/
          retention-days: 7
