name: Build

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kubarr-backend-test
            dockerfile: docker/Dockerfile.api
            target: test
          - image: kubarr-frontend-test
            dockerfile: docker/Dockerfile.frontend
            target: test
          - image: kubarr-backend
            dockerfile: docker/Dockerfile.api
          - image: kubarr-worker
            dockerfile: docker/Dockerfile.worker
          - image: kubarr-frontend
            dockerfile: docker/Dockerfile.frontend
          - image: kubarr-dns-webhook
            dockerfile: docker/Dockerfile.dns-webhook

    steps:
      - name: Free disk space
        run: |
          docker image prune -f || true
          docker container prune -f || true
          docker volume prune -f || true
          df -h

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Extract version metadata
        id: meta
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' code/frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect channel from git ref
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta) ]]; then
            CHANNEL="release"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image }}
        env:
          DOCKER_BUILDKIT: '1'
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_NAME: ${{ matrix.image }}:${{ inputs.image-tag }}
          TARGET: ${{ matrix.target || '' }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Build attempt ${attempt}/3 ==="
            build_args=(-f "$DOCKERFILE" -t "$IMAGE_NAME")
            if [ -n "$TARGET" ]; then
              build_args+=(--target "$TARGET")
            fi
            if docker build "${build_args[@]}" \
                --build-arg "VERSION=$VERSION" \
                --build-arg "CHANNEL=$CHANNEL" \
                --build-arg "COMMIT_HASH=$COMMIT_HASH" \
                --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" .; then
              echo "Build succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed, waiting 3 minutes before retry (rate limit backoff)..."
              sleep 180
            fi
          done
          echo "ERROR: Build failed after 3 attempts"
          exit 1

      - name: Save image
        run: docker save "${{ matrix.image }}:${{ inputs.image-tag }}" > "${{ matrix.image }}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.image }}
          path: ${{ matrix.image }}.tar

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Extract version metadata
        id: meta
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' code/frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect channel from git ref
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta) ]]; then
            CHANNEL="release"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build documentation
        env:
          KUBARR_VERSION: ${{ steps.meta.outputs.version }}
          KUBARR_CHANNEL: ${{ steps.meta.outputs.channel }}
          KUBARR_COMMIT: ${{ github.sha }}
        run: npm run docs:build
