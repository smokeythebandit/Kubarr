name: Build

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: kubarr-backend
            dockerfile: docker/Dockerfile.api
          - component: frontend
            image: kubarr-frontend
            dockerfile: docker/Dockerfile.frontend
          - component: worker
            image: kubarr-worker
            dockerfile: docker/Dockerfile.worker
          - component: dns-webhook
            image: kubarr-dns-webhook
            dockerfile: docker/Dockerfile.dns-webhook

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Extract version metadata
        id: meta
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' code/frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect channel from git ref
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta) ]]; then
            CHANNEL="release"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:${{ inputs.image-tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            CHANNEL=${{ steps.meta.outputs.channel }}
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Save image
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: docker save "${IMAGE}:${IMAGE_TAG}" | gzip -1 > "${IMAGE}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.image }}
          path: ${{ matrix.image }}.tar.gz
          compression-level: 0
          retention-days: 1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version metadata
        id: meta
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' code/frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect channel from git ref
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta) ]]; then
            CHANNEL="release"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Build documentation
        env:
          KUBARR_VERSION: ${{ steps.meta.outputs.version }}
          KUBARR_CHANNEL: ${{ steps.meta.outputs.channel }}
          KUBARR_COMMIT: ${{ github.sha }}
        run: npm run docs:build
