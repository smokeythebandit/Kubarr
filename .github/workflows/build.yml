name: Build

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  cli:
    name: CLI / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: code/cli
      - name: Build release CLI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --manifest-path code/cli/Cargo.toml
      - name: Verify web-only installer
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="code/cli/target/${TARGET}/release/kubarr"
          bootstrap_help="$("$binary" bootstrap --web --help)"
          if [[ "$bootstrap_help" != *"--web-port"* || "$bootstrap_help" == *"--cluster-mode"* ]]; then
            echo "The CLI must contain the web-only bootstrap installer." >&2
            exit 1
          fi
          if "$binary" install --help >/dev/null 2>&1; then
            echo "The CLI still includes the legacy install command." >&2
            exit 1
          fi
      - name: Package binary and checksum
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir release-assets
          asset="release-assets/kubarr-linux-${ARCH}.tar.gz"
          tar -C "code/cli/target/${TARGET}/release" -czf "$asset" kubarr
          sha256sum "$asset" | cut -d ' ' -f 1 > "$asset.sha256"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kubarr-cli-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: kubarr-backend
            dockerfile: docker/Dockerfile.api
          - component: frontend
            image: kubarr-frontend
            dockerfile: docker/Dockerfile.frontend
          - component: worker
            image: kubarr-worker
            dockerfile: docker/Dockerfile.worker
          - component: dns-webhook
            image: kubarr-dns-webhook
            dockerfile: docker/Dockerfile.dns-webhook

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Extract version metadata
        id: meta
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' code/frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect channel from git ref
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta) ]]; then
            CHANNEL="release"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:${{ inputs.image-tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            CHANNEL=${{ steps.meta.outputs.channel }}
            COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Save image
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: docker save "${IMAGE}:${IMAGE_TAG}" | gzip -1 > "${IMAGE}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.image }}
          path: ${{ matrix.image }}.tar.gz
          compression-level: 0
          retention-days: 1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Extract version metadata
        id: meta
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' code/frontend/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect channel from git ref
          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta) ]]; then
            CHANNEL="release"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Build documentation
        env:
          KUBARR_VERSION: ${{ steps.meta.outputs.version }}
          KUBARR_CHANNEL: ${{ steps.meta.outputs.channel }}
          KUBARR_COMMIT: ${{ github.sha }}
        run: npm run docs:build
