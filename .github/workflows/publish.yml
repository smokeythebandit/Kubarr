name: Publish

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  cli:
    name: Publish CLI binaries
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: kubarr-cli-*
          path: release-assets
          merge-multiple: true
      - name: Publish CLI release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Require both architectures before updating the public download.
          for arch in x86_64 aarch64; do
            asset="release-assets/kubarr-linux-${arch}.tar.gz"
            test -s "$asset"
            expected_hash="$(<"$asset.sha256")"
            [[ "$expected_hash" =~ ^[[:xdigit:]]{64}$ ]]
            printf '%s  %s\n' "$expected_hash" "$asset" | sha256sum --check --status
          done

          latest=true
          release_flags=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # Immutable releases cannot reuse a rolling tag or replace published assets.
            tag="cli-${GITHUB_SHA}"
            notes="Linux CLI snapshot used by https://kubarr.com/install.sh. Built from Kubarr main commit ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            release_flags+=(--target "$GITHUB_SHA" --title "Kubarr CLI (${GITHUB_SHA:0:7})" --notes "$notes")
          else
            tag="$GITHUB_REF_NAME"
            release_flags+=(--verify-tag --title "Kubarr ${tag}" --generate-notes)
            if [[ "$tag" == *-* ]]; then
              latest=false
              release_flags+=(--prerelease)
            fi
          fi

          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" == false ]]; then
              # A completed rerun is a no-op; a published release missing assets
              # cannot be repaired by overwriting it when immutability is enabled.
              published_assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
              for asset in release-assets/*; do
                if ! grep -Fxq "${asset##*/}" <<< "$published_assets"; then
                  echo "Published release $tag is missing ${asset##*/}; publish a new ref instead." >&2
                  exit 1
                fi
              done
              echo "CLI assets are already published for $tag."
              exit 0
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --draft --latest=false "${release_flags[@]}"
          fi

          # Keep the release mutable until both archives and checksums are attached.
          gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [backend, worker, frontend, dns-webhook]

    steps:
      - name: Compute image name
        id: vars
        run: echo "image=${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kubarr-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubarr-${{ matrix.image }}

      - name: Load image
        run: gunzip -c "kubarr-${{ matrix.image }}.tar.gz" | docker load

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Tag and push
        run: |
          LOCAL_IMAGE="kubarr-${{ matrix.image }}:${{ inputs.image-tag }}"
          REPO="${{ steps.vars.outputs.image }}"
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            docker tag "$LOCAL_IMAGE" "$tag"
          done
          docker push --all-tags "$REPO"

      - name: Summary
        run: |
          {
            echo "## ${{ matrix.image }} published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
