name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────

  backend-fmt-clippy:
    name: backend / fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: code/api
      - run: cargo fmt --check
        working-directory: code/api
      - run: cargo clippy --no-deps -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
        working-directory: code/api

  backend-docs:
    name: backend / docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: code/api
      - run: cargo doc --no-deps --document-private-items
        working-directory: code/api
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

  backend-msrv:
    name: backend / msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@98e1b82157cd469e843cb7f524c1313b4ad9492c
        with:
          toolchain: '1.88'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: code/api
      - run: cargo check --locked
        working-directory: code/api

  backend-deny:
    name: backend / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: code/api/Cargo.toml

  backend-unused-deps:
    name: backend / unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: code/api
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: cargo-machete
      - run: cargo machete
        working-directory: code/api

  backend-toml-fmt:
    name: backend / toml fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532
        with:
          tool: taplo-cli
      - run: taplo fmt --check
        working-directory: code/api

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend-lint:
    name: frontend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: code/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: code/frontend
      - run: pnpm run lint
        working-directory: code/frontend
      - run: pnpm audit --prod --audit-level high
        working-directory: code/frontend

  # ── General ──────────────────────────────────────────────────────────────────

  secrets:
    name: general / secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: general / trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

  dockerfiles:
    name: general / dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6
        with:
          dockerfile: docker/Dockerfile.api
          config: docker/.hadolint.yaml
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6
        with:
          dockerfile: docker/Dockerfile.frontend
          config: docker/.hadolint.yaml
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6
        with:
          dockerfile: docker/Dockerfile.worker
          config: docker/.hadolint.yaml
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6
        with:
          dockerfile: docker/Dockerfile.dns-webhook
          config: docker/.hadolint.yaml
