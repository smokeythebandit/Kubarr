name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  fast-test:
    uses: ./.github/workflows/fast-test.yml

  build:
    needs: [check, fast-test]
    uses: ./.github/workflows/build.yml
    with:
      image-tag: ci-${{ github.sha }}

  test:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml
    with:
      image-tag: ci-${{ github.sha }}

  acceptance:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/acceptance.yml
    with:
      image-tag: ci-${{ github.sha }}

  vpn-acceptance:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/vpn-acceptance.yml
    with:
      image-tag: ci-${{ github.sha }}

  publish:
    needs: [build, test, acceptance, vpn-acceptance]
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.build.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') &&
        needs.test.result == 'success' && needs.acceptance.result == 'success' &&
        needs.vpn-acceptance.result == 'success') ||
       (!startsWith(github.ref, 'refs/tags/v') &&
        needs.test.result == 'skipped' && needs.acceptance.result == 'skipped' &&
        needs.vpn-acceptance.result == 'skipped'))
    uses: ./.github/workflows/publish.yml
    with:
      image-tag: ci-${{ github.sha }}
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    secrets: inherit
