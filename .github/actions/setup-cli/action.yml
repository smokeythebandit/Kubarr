name: Set up Kubarr CLI
description: Build the pinned standalone CLI for Kubarr integration tests
runs:
  using: composite
  steps:
    - name: Checkout standalone CLI
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: smokeythebandit/kubarr-cli
        ref: bdbf29e4e84caeaee33842f143ab82dff1610643 # 0.2.4
        path: .installer-cli
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: .installer-cli
    - name: Build and expose CLI
      shell: bash
      run: |
        cargo build --locked --manifest-path "$GITHUB_WORKSPACE/.installer-cli/Cargo.toml"
        binary="$GITHUB_WORKSPACE/.installer-cli/target/debug/kubarr"
        "$binary" --version
        printf 'KUBARR_CLI=%s\n' "$binary" >> "$GITHUB_ENV"
        printf '%s\n' "${binary%/*}" >> "$GITHUB_PATH"
