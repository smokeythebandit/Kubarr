version: "3.8"

x-runner-common: &runner-common
  image: myoung34/github-runner:latest
  restart: always
  network_mode: host
  environment:
    REPO_URL: https://github.com/bmartensNL/Kubarr
    GITHUB_TOKEN: ${GITHUB_TOKEN}
    RUNNER_WORKDIR: /mnt/storage/personal/runners/work
    LABELS: self-hosted,Linux,X64
    EPHEMERAL: "1"
    DOCKER_GID: "985"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /mnt/storage/personal/runners/work:/mnt/storage/personal/runners/work
    - /usr/local/bin/kind:/usr/local/bin/kind:ro
    - /usr/bin/kubectl:/usr/bin/kubectl:ro
    - /usr/local/bin/helm:/usr/local/bin/helm:ro

services:
  runner-1:
    <<: *runner-common
    container_name: github-runner-1
  runner-2:
    <<: *runner-common
    container_name: github-runner-2
  runner-3:
    <<: *runner-common
    container_name: github-runner-3
  runner-4:
    <<: *runner-common
    container_name: github-runner-4
  runner-5:
    <<: *runner-common
    container_name: github-runner-5
  runner-6:
    <<: *runner-common
    container_name: github-runner-6
