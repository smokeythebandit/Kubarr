version: "3.8"

x-runner-common: &runner-common
  image: myoung34/github-runner:latest
  restart: always
  network_mode: host
  environment:
    REPO_URL: https://github.com/smokeythebandit/Kubarr
    ACCESS_TOKEN: ${GITHUB_TOKEN}
    LABELS: self-hosted,Linux,X64
    EPHEMERAL: "1"
    DOCKER_GID: "985"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /usr/local/bin/kind:/usr/local/bin/kind:ro
    - /usr/bin/kubectl:/usr/bin/kubectl:ro
    - /usr/local/bin/helm:/usr/local/bin/helm:ro

services:
  runner-1:
    <<: *runner-common
    container_name: github-runner-1
    environment:
      REPO_URL: https://github.com/smokeythebandit/Kubarr
      ACCESS_TOKEN: ${GITHUB_TOKEN}
      RUNNER_WORKDIR: /mnt/storage/personal/runners/work/1
      LABELS: self-hosted,Linux,X64
      EPHEMERAL: "1"
      DOCKER_GID: "985"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/storage/personal/runners/work/1:/mnt/storage/personal/runners/work/1
      - /usr/local/bin/kind:/usr/local/bin/kind:ro
      - /usr/bin/kubectl:/usr/bin/kubectl:ro
      - /usr/local/bin/helm:/usr/local/bin/helm:ro
